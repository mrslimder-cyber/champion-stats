<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swiss 2-2 · Worlds 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1624;--panel:#13243a;--line:#26405f;--text:#e8eef6;--mute:#8ea3bb;--gold:#c8aa6e;--ok:#5ad19a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2f7;--panel:#fff;--line:#c7d3e2;--text:#12263d;--mute:#5a6f88;--gold:#8a6d2b;--ok:#17855a}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 Barlow,system-ui,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 18px 56px}
h1{font:700 clamp(30px,6vw,44px)/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px}
h2{font:700 24px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:38px 0 12px;color:var(--gold)}
.sub{color:var(--mute);margin:0 0 20px}
.matches{display:flex;flex-direction:column;gap:12px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.slot{display:flex;align-items:center;gap:12px;min-height:76px;padding:6px 10px;border-radius:10px;border:1.5px dashed transparent;font:700 clamp(22px,5vw,30px)/1 "Barlow Condensed",sans-serif}
.slot.r{flex-direction:row-reverse;text-align:right}
.slot.empty{border-color:var(--line);color:var(--mute);justify-content:center;font-size:28px}
.slot.next{border-color:var(--gold);color:var(--gold)}
.slot.fill{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
.vs{color:var(--mute);font:600 15px Barlow,sans-serif}
.status{margin:0 0 12px;padding:10px 14px;border-left:4px solid var(--gold);background:var(--panel);border-radius:0 8px 8px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.cell{display:flex;flex-direction:column;gap:6px}
.team{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px 8px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;min-height:124px;width:100%;transition:transform .15s,border-color .15s}
.team:hover:not(:disabled){transform:translateY(-3px);border-color:var(--gold)}
.team:focus-visible,.btn:focus-visible,summary:focus-visible,.seg:focus-visible,.credit a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.team:disabled{cursor:not-allowed;opacity:.38}
.team b{font:700 19px/1 "Barlow Condensed",sans-serif}
.team small{color:var(--mute);font-size:12.5px;text-align:center;min-height:18px;line-height:1.2}
.team small.pct{color:var(--ok);font-weight:600;font-size:15px}
.swap{background:transparent;color:var(--gold);border:1.5px dashed var(--gold);border-radius:8px;padding:3px 6px;font:600 13px Barlow,sans-serif;cursor:pointer}
.swap:hover{background:color-mix(in srgb,var(--gold) 15%,transparent)}
.swap:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;gap:10px;margin-top:20px}
.btn{background:transparent;color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:8px 16px;font:600 15px Barlow,sans-serif;cursor:pointer;display:inline-block}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.segs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.seg{background:transparent;color:var(--text);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
.seg[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.note{color:var(--mute);font-size:14px;margin:0 0 14px}
.prow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:8px;font:700 18px "Barlow Condensed",sans-serif}
.prow i{font-style:normal;color:var(--mute);font-weight:500;font-size:14px}
.prow .t{display:flex;align-items:center;gap:6px;min-width:84px}
.prow.fixed{border-color:var(--gold)}
.prow.fixed .pbar div{background:var(--gold)}
.prow.fixed em{color:var(--gold)}
.team small .go{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px}
.cnt{color:var(--mute);font:500 14px Barlow,sans-serif;min-width:54px;text-align:right}
.pbar{flex:1;min-width:50px;height:10px;background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:5px;overflow:hidden}
.pbar div{height:100%;background:var(--ok);border-radius:5px}
.prow em{font-style:normal;color:var(--ok);min-width:58px;text-align:right;font-size:20px}
details{margin-top:34px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.lg div{display:flex;align-items:center;gap:10px}
.lg input{display:none}
.played{color:var(--mute);margin-top:22px;font-size:14px}
.credit{margin:0 0 20px;display:flex;align-items:center;gap:10px;color:var(--mute);font-size:15px}
.credit a{display:inline-flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-weight:600}
.credit a:hover{color:var(--gold)}
.credit svg{width:20px;height:20px;fill:currentColor}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
.right{position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
.right h2{margin-top:0}
.left .sub{margin-bottom:14px}
@media (max-width:880px){.layout{grid-template-columns:1fr;gap:6px}.right{position:static}.right h2{margin-top:34px}}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
.badge{display:block;flex:none;object-fit:contain}
img.badge{background:#f4f6fa;border-radius:22%;padding:3px}
@media (prefers-reduced-motion:reduce){.team{transition:none}.slot.fill{animation:none}}
</style>
</head>

  <h1>Swiss 2-2 · Worlds 2026</h1>

  <div class="layout">
    <section class="left">
      <p class="sub">Elige los equipos en orden: primero el de la izquierda y luego su rival. Si ya jugaron, el equipo pasa al siguiente cruce.</p>

      <div class="grid" id="teams"></div>

      <div class="bar">
        <button class="btn" id="undo">Deshacer</button>
        <button class="btn" id="reset">Reiniciar</button>
      </div>
      <p class="played" id="played"></p>
    </section>

    <aside class="right">
      <h2>Probabilidad de cada cruce</h2>
      <p class="note" id="modenote"></p>
      <div id="probs"></div>
    </aside>
  </div>
</main>

<script>
const TEAMS={MKOI:'#6f55e0',KC:'#2a67e8',TLAW:'#2f8bc9',HLE:'#e8641a',G2:'#2b2b33',BLG:'#27a9d6',LYON:'#c99a1f',LOS:'#f05a28'};
const PLAYED=[['MKOI','BLG'],['LYON','KC'],['KC','BLG'],['BLG','TLAW'],['LOS','G2']];
const key=(a,b)=>[a,b].sort().join('-');
const playedSet=new Set(PLAYED.map(p=>key(p[0],p[1])));
function matchings(list){
  if(!list.length) return [[]];
  const [a,...rest]=list, out=[];
  for(const b of rest){
    if(playedSet.has(key(a,b))) continue;
    for(const m of matchings(rest.filter(x=>x!==b))) out.push([[a,b],...m]);
  }
  return out;
}

let six='HLE', third='TLAW', NAMES, ALL;
function build(){
  NAMES=['MKOI','KC',third,six,'BLG','LYON'];
  ALL=matchings(NAMES);
  const pl=PLAYED.filter(p=>NAMES.includes(p[0])&&NAMES.includes(p[1]));
  document.getElementById('played').textContent='Ya jugados: '+pl.map(p=>p.join('-')).join(', ')+'.';
}

function logo(t,s=56){
  const src=LOGOS[t];
  if(src) return `<img class="badge" src="${src}" width="${s}" height="${s}" alt="${t}">`;
  const d='M32 3 59 12v24c0 17-12 28-27 33C17 64 5 53 5 36V12z', fs=t.length>3?17:22;
  return `<svg class="badge" width="${s}" height="${Math.round(s*1.1)}" viewBox="0 0 64 72" role="img" aria-label="${t}"><path d="${d}" fill="${TEAMS[t]}"/><path d="${d}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2.5"/><text x="32" y="43" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="${fs}" fill="#fff">${t}</text></svg>`;
}

/* Estado: tres cruces, cada uno con equipo izquierdo (l) y derecho (r) */
let M=[{},{},{}], hist=[], fresh=new Set(), msg='';
const hasPair=(m,a,b)=>m.some(q=>key(q[0],q[1])===key(a,b));
const completed=()=>M.filter(m=>m.l&&m.r).map(m=>[m.l,m.r]);
const openLefts=()=>M.filter(m=>m.l&&!m.r).map(m=>m.l);
const placed=()=>M.flatMap(m=>[m.l,m.r]).filter(Boolean);
function combos(extra,lefts){
  const dp=completed().concat(extra);
  return ALL.filter(m=>dp.every(p=>hasPair(m,p[0],p[1])) && !m.some(q=>lefts.includes(q[0])&&lefts.includes(q[1])));
}
function dest(t){
  const ol=openLefts();
  for(let i=0;i<3;i++){
    const m=M[i];
    if(m.l&&!m.r){
      const c=combos([[m.l,t]],ol.filter(x=>x!==m.l));
      if(c.length) return {k:'r',i};
    }
  }
  const i=M.findIndex(m=>!m.l);
  if(i>=0 && combos([],ol.concat(t)).length) return {k:'l',i};
  return null;
}
const fmt=v=>String(Math.round(v*10)/10).replace('.',',')+'%';

function slot(i,side){
  const t=M[i][side], cls='slot'+(side==='r'?' r':'');
  if(t) return `<div class="${cls}${fresh.has(i+side)?' fill':''}">${logo(t,56)}<span>${t}</span></div>`;
  const fo=M.findIndex(m=>m.l&&!m.r), fe=M.findIndex(m=>!m.l);
  const next = fo>=0 ? (i===fo&&side==='r') : (i===fe&&side==='l');
  return `<div class="${cls} empty${next?' next':''}">?</div>`;
}

/* Teoría: se cuentan todas las combinaciones posibles de cruces y en cuántas aparece cada cruce */
function renderProbs(){
  const N=ALL.length, C={};
  ALL.forEach(m=>m.forEach(q=>{const k=key(q[0],q[1]); C[k]=(C[k]||0)+1;}));
  document.getElementById('probs').innerHTML=Object.entries(C).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([k,v])=>{
    const [a,b]=k.split('-');
    return `<div class="prow"><span class="t">${logo(a,28)}${a}</span><i>vs</i><span class="t">${logo(b,28)}${b}</span><div class="pbar"><div style="width:${v/N*100}%"></div></div><span class="cnt">${v} de ${N}</span><em>${fmt(v/N*100)}</em></div>`;
  }).join('');
  document.getElementById('modenote').textContent=`Hay ${N} combinaciones posibles de cruces. Aquí se cuenta en cuántas aparece cada cruce. Es la teoría y no cambia con lo que eliges a la izquierda.`;
}

function render(){
  document.getElementById('matches').innerHTML=[0,1,2].map(i=>
    `<div class="match">${slot(i,'l')}<span class="vs">vs</span>${slot(i,'r')}</div>`).join('');

  const fo=M.findIndex(m=>m.l&&!m.r);
  const opts=NAMES.filter(t=>!placed().includes(t)).map(t=>[t,dest(t)]).filter(o=>o[1]);
  const pc=opts.length?fmt(100/opts.length):'';
  document.getElementById('teams').innerHTML=NAMES.map(t=>{
    let dis=false, small='<small></small>';
    if(placed().includes(t)){dis=true;small='<small>En un cruce</small>';}
    else{
      const d=dest(t);
      if(!d){dis=true;small='<small>No es posible</small>';}
      else small=`<small class="pct">${pc}${d.k==='l'&&fo>=0?'<span class="go">irá al siguiente cruce</span>':''}</small>`;
    }
    const btn=`<button class="team" data-t="${t}" ${dis?'disabled':''}>${logo(t,56)}<b>${t}</b>${small}</button>`;
    const alt=t===six?{slot:'six',to:six==='HLE'?'G2':'HLE'}:t===third?{slot:'third',to:third==='TLAW'?'LOS':'TLAW'}:null;
    return alt ? `<div class="cell">${btn}<button class="swap" data-slot="${alt.slot}" data-to="${alt.to}">Cambiar por ${alt.to}</button></div>` : `<div class="cell">${btn}</div>`;
  }).join('');

  document.getElementById('status').textContent =
    placed().length>=6 ? 'Cruces completos.' :
    (fo>=0 ? `Elige el rival de ${M[fo].l}.` :
    placed().length ? 'Elige el equipo de la izquierda del siguiente cruce.' : 'Elige el equipo de la izquierda del primer cruce.')+' El porcentaje es la probabilidad de que salga esa bola.';
  if(msg) document.getElementById('status').textContent=msg+' '+document.getElementById('status').textContent;
  document.getElementById('undo').disabled=!hist.length;
  renderProbs();
}

document.getElementById('teams').addEventListener('click',e=>{
  const s=e.target.closest('.swap');
  if(s){
    const isSix=s.dataset.slot==='six', old=isSix?six:third, nw=s.dataset.to;
    if(isSix) six=nw; else third=nw;
    M.forEach(m=>{if(m.l===old)m.l=nw; if(m.r===old)m.r=nw;});
    hist=[]; fresh=new Set(); msg=''; build();
    /* con el cambio puede aparecer un cruce ya jugado (p. ej. LOS-G2): si pasa, se reinicia */
    if(!combos([],openLefts()).length){M=[{},{},{}]; msg='Se reiniciaron los cruces porque con ese cambio ya no eran posibles.';}
    render(); return;
  }
  const b=e.target.closest('button.team'); if(!b||b.disabled) return;
  const t=b.dataset.t, d=dest(t); if(!d) return;
  msg='';
  hist.push(JSON.stringify(M)); fresh=new Set();
  if(d.k==='r'){M[d.i].r=t;fresh.add(d.i+'r');} else {M[d.i].l=t;fresh.add(d.i+'l');}
  const un=NAMES.filter(x=>!placed().includes(x));
  if(openLefts().length===0 && un.length===2){
    const i=M.findIndex(m=>!m.l); M[i].l=un[0]; M[i].r=un[1]; fresh.add(i+'l'); fresh.add(i+'r');
  } else if(un.length===1){
    const i=M.findIndex(m=>m.l&&!m.r); M[i].r=un[0]; fresh.add(i+'r');
  }
  render();
});
document.getElementById('undo').onclick=()=>{ if(!hist.length) return; M=JSON.parse(hist.pop()); fresh=new Set(); render(); };
document.getElementById('reset').onclick=()=>{M=[{},{},{}];hist=[];fresh=new Set();render();};


build();
render();
</script>
